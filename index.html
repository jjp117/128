<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>jjp反 AI 噪点生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00e5;
            --glass-bg: rgba(15, 15, 35, 0.7);
            --glass-border: rgba(0, 245, 255, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
        body {
            background: #0a0a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            color: #e0e0ff;
        }
        .aurora-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, #0d1b2a 0%, #0a0a1a 70%);
        }
        .aurora-bg::before {
            content: ''; position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0,245,255,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(255,0,229,0.04) 0%, transparent 50%);
            animation: aurora-flow 25s ease-in-out infinite;
        }
        @keyframes aurora-flow { 0%,100%{transform:translate(0,0)} 50%{transform:translate(2%,2%)} }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 20px; margin-bottom: 16px;
        }
        .btn {
            padding: 8px 16px; background: rgba(0,245,255,0.05);
            border: 1px solid rgba(0,245,255,0.3); border-radius: 8px;
            color: var(--neon-cyan); font-size: 13px; cursor: pointer;
            transition: background-color 0.2s; display: inline-flex;
            align-items: center; gap: 6px; flex: 1 1 auto; min-width: 100px; justify-content: center;
        }
        .btn:hover { background: rgba(0,245,255,0.1); }
        .btn.active { border-color: var(--neon-magenta); color: var(--neon-magenta); background: rgba(255,0,229,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .slider {
            width: 100%; height: 6px;
            background: linear-gradient(90deg, rgba(0,245,255,0.3), rgba(255,0,229,0.3));
            border-radius: 3px; outline: none; -webkit-appearance: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            background: var(--neon-cyan); border-radius: 50%; cursor: pointer;
        }
        .slider::-moz-range-thumb {
            width: 18px; height: 18px; background: var(--neon-cyan);
            border-radius: 50%; cursor: pointer; border: none;
        }
        .upload-zone {
            border: 2px dashed rgba(0,245,255,0.3); border-radius: 12px;
            padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.2s;
        }
        .upload-zone:hover { border-color: var(--neon-cyan); }
        .upload-zone.dragover { border-color: var(--neon-magenta); }
        .canvas-container { position: relative; display: flex; justify-content: center; width: 100%; }
        .canvas-display { border-radius: 8px; border: 1px solid rgba(0,245,255,0.2); max-width: 100%; height: auto; }
        .magnifier {
            position: absolute; width: 100px; height: 100px;
            border: 3px solid rgba(0,245,255,0.6); border-radius: 50%;
            pointer-events: none; display: none; overflow: hidden;
            box-shadow: 0 0 15px rgba(0,245,255,0.3); z-index: 100;
            transition: width 0.2s, height 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .magnifier.active {
            width: 150px; height: 150px; border-color: #00f5ff;
            box-shadow: 0 0 30px rgba(0,245,255,0.6), inset 0 0 20px rgba(0,245,255,0.1);
        }
        .magnifier canvas { width: 100%; height: 100%; }
        .compare-container {
            position: relative; border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(0,245,255,0.2); margin: 0 auto;
        }
        .split-line {
            position: absolute; top: 0; bottom: 0; width: 3px;
            background: var(--neon-cyan); cursor: ew-resize; z-index: 10;
        }
        .split-handle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 28px; height: 28px; background: rgba(0,245,255,0.2);
            border: 2px solid var(--neon-cyan); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .compare-label {
            position: absolute; top: 8px; padding: 3px 8px;
            background: rgba(0,0,0,0.6); border-radius: 4px; font-size: 11px;
        }
        .compare-label.original { left: 8px; color: #67e8f9; }
        .compare-label.processed { right: 8px; color: #f9a8d4; }
        .container { position: relative; width: 100%; min-height: 100vh; overflow-y: auto; z-index: 1; }
        .content {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 16px; gap: 14px; width: 100%;
        }
        .header { text-align: center; width: 100%; }
        .header h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            background: linear-gradient(to right, #22d3ee, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header p { font-size: clamp(0.7rem, 2.5vw, 0.85rem); color: #9ca3af; margin-top: 6px; }
        .main-panel { width: 100%; max-width: 896px; }
        .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .slider-label { font-size: 0.85rem; color: #d1d5db; }
        .slider-value { font-size: 0.85rem; color: #22d3ee; font-family: monospace; }
        .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .info-footer { width: 100%; max-width: 896px; }
        .info-items {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
            font-size: clamp(0.65rem, 2vw, 0.75rem); color: #6b7280;
        }
        .hidden { display: none; }
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(10,10,26,0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; flex-direction: column; gap: 16px;
        }
        .loading-overlay.active { display: flex; }
        .loading-spinner {
            width: 48px; height: 48px; border: 3px solid rgba(0,245,255,0.2);
            border-top-color: var(--neon-cyan); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { 
            color: #67e8f9; 
            font-size: 14px; 
            text-align: center;
            white-space: pre-line;
            line-height: 1.6;
        }
        /* OCR Panel */
        .ocr-panel {
            background: rgba(15,15,35,0.8); border: 1px solid rgba(255,0,229,0.3);
            border-radius: 12px; padding: 16px; margin-top: 12px;
        }
        .ocr-panel h3 { color: #f9a8d4; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .ocr-section { margin-bottom: 12px; }
        .ocr-label { font-size: 12px; color: #9ca3af; margin-bottom: 6px; font-weight: 600; }
        .ocr-text {
            padding: 10px; background: rgba(0,0,0,0.4); border-radius: 8px;
            font-family: monospace; font-size: 13px; color: #e0e0ff;
            word-break: break-all; min-height: 40px; line-height: 1.5;
        }
        .ocr-text.original { border-left: 3px solid #4ade80; }
        .ocr-text.protected { border-left: 3px solid #f87171; }
        .similarity-bar {
            width: 100%; height: 24px; background: rgba(0,0,0,0.3);
            border-radius: 12px; overflow: hidden; position: relative; margin-top: 8px;
        }
        .similarity-fill {
            height: 100%; transition: width 0.5s ease, background-color 0.5s ease;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; color: white;
        }
        .status-message {
            padding: 10px; border-radius: 8px; margin-top: 12px;
            font-size: 13px; font-weight: 600; text-align: center;
        }
        .status-message.success { background: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid #4ade80; }
        .status-message.warning { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid #fbbf24; }
        .status-message.danger { background: rgba(248,113,113,0.2); color: #f87171; border: 1px solid #f87171; }
        .mode-desc { font-size: 11px; color: #6b7280; margin-top: 4px; }
        @media (max-width: 640px) {
            .content { padding: 12px; gap: 10px; }
            .glass-panel { padding: 14px; border-radius: 12px; }
            .upload-zone { padding: 24px 12px; }
            .btn { min-width: 80px; padding: 7px 10px; font-size: 12px; }
        }
    </style>
</head>

    <div class="container">

    <script>
        const state = {
            image: null, originalData: null,
            intensity: 500, mode: 'blind',
            compareMode: false, splitPosition: 50,
            isDraggingSplit: false,
            originalOCR: '', protectedOCR: ''
        };
        const PRESETS = {
            human: { intensity: 200, desc: 'Human First：仅色彩混淆，轻微色差' },
            blind: { intensity: 500, desc: 'Machine Blind：全量 A+B+C 算法' },
            paranoid: { intensity: 800, desc: 'Paranoid：高强度 + 高斯模糊' }
        };
        const $ = id => document.getElementById(id);
        const uploadZone=$('uploadZone'), fileInput=$('fileInput'),
              mainCanvas=$('mainCanvas'), canvasArea=$('canvasArea'),
              controlsArea=$('controlsArea'), intensitySlider=$('intensitySlider'),
              intensityValue=$('intensityValue'), compareBtn=$('compareBtn'),
              ocrBtn=$('ocrBtn'), exportBtn=$('exportBtn'), resetBtn=$('resetBtn'),
              ocrPanel=$('ocrPanel'), loadingOverlay=$('loadingOverlay'),
              loadingText=$('loadingText'), modeDesc=$('modeDesc');
        let compareCanvas=null, compareContainer=null;

        function showLoading(text='请等待...') {
            loadingText.textContent = text;
            loadingOverlay.classList.add('active');
        }
        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        // === CORE ALGORITHM: Three-step brute force ===

        // Step A: Moiré Pattern Overlay (high-frequency stripes)
        function applyMoirePattern(data, width, height, strength) {
            // 从0开始均匀增长，100%时达到最大效果
            const opacity = strength * 0.25; // 0% ~ 25%
            const frequency = 3 + strength * 2; // 3 ~ 5 pixels per cycle
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const pattern = Math.sin(x / frequency * Math.PI * 2) * Math.sin(y / frequency * Math.PI * 2);
                    const offset = pattern * 255 * opacity;
                    data[i] = Math.max(0, Math.min(255, data[i] + offset));
                    data[i+1] = Math.max(0, Math.min(255, data[i+1] + offset));
                    data[i+2] = Math.max(0, Math.min(255, data[i+2] + offset));
                }
            }
        }

        // Step B: Random Stroke Erosion (break text strokes)
        function applyStrokeErosion(data, width, height, strength) {
            // 从0开始均匀增长
            const erosionRate = strength * 0.3; // 0% ~ 30%
            const threshold = 128;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
                    
                    if (brightness < threshold && Math.random() < erosionRate) {
                        const gray = 200 + Math.random() * 55;
                        data[i] = gray;
                        data[i+1] = gray;
                        data[i+2] = gray;
                    }
                }
            }
        }

        // Step C: Color Space Confusion (chromatic aberration)
        function applyColorConfusion(data, width, height, strength) {
            // 从0开始均匀增长
            const amp = strength * 20; // 0 ~ 20
            const freq = 0.05;
            const phaseR = 0;
            const phaseG = Math.PI / 2;
            const phaseB = Math.PI;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    const pos = x * freq + y * freq;
                    
                    data[i] = Math.max(0, Math.min(255, data[i] + Math.sin(pos + phaseR) * amp));
                    data[i+1] = Math.max(0, Math.min(255, data[i+1] + Math.sin(pos + phaseG) * amp));
                    data[i+2] = Math.max(0, Math.min(255, data[i+2] + Math.sin(pos + phaseB) * amp));
                }
            }
        }

        // Gaussian blur for paranoid mode
        function applyGaussianBlur(data, width, height, radius) {
            const kernel = [];
            const sigma = radius / 2;
            let sum = 0;
            
            for (let y = -radius; y <= radius; y++) {
                for (let x = -radius; x <= radius; x++) {
                    const weight = Math.exp(-(x*x + y*y) / (2 * sigma * sigma));
                    kernel.push({ x, y, weight });
                    sum += weight;
                }
            }
            
            kernel.forEach(k => k.weight /= sum);
            
            const temp = new Uint8ClampedArray(data);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;
                    
                    kernel.forEach(k => {
                        const px = Math.max(0, Math.min(width-1, x + k.x));
                        const py = Math.max(0, Math.min(height-1, y + k.y));
                        const i = (py * width + px) * 4;
                        r += temp[i] * k.weight;
                        g += temp[i+1] * k.weight;
                        b += temp[i+2] * k.weight;
                    });
                    
                    const i = (y * width + x) * 4;
                    data[i] = r;
                    data[i+1] = g;
                    data[i+2] = b;
                }
            }
        }

        // Main camouflage function
        function applyCamouflage() {
            if (!state.originalData || !state.image) return;
            const ctx = mainCanvas.getContext('2d');
            const width = mainCanvas.width, height = mainCanvas.height;
            const strength = state.intensity / 1000;

            const data = new Uint8ClampedArray(state.originalData);

            if (strength > 0.001) {
                if (state.mode === 'human') {
                    applyColorConfusion(data, width, height, strength);
                } else if (state.mode === 'blind') {
                    applyMoirePattern(data, width, height, strength);
                    applyStrokeErosion(data, width, height, strength);
                    applyColorConfusion(data, width, height, strength);
                } else if (state.mode === 'paranoid') {
                    applyMoirePattern(data, width, height, strength);
                    applyStrokeErosion(data, width, height, strength);
                    applyColorConfusion(data, width, height, strength);
                    applyGaussianBlur(data, width, height, 2);
                }
                
                const imageData = new ImageData(data, width, height);
                ctx.putImageData(imageData, 0, 0);
            } else {
                // Bug Fix: 指定目标尺寸，避免图片以原始大小绘制到左上角
                ctx.drawImage(state.image, 0, 0, width, height);
            }
        }

        // Calculate string similarity (Levenshtein-based)
        function calculateSimilarity(str1, str2) {
            if (!str1 && !str2) return 100;
            if (!str1 || !str2) return 0;
            
            const len1 = str1.length, len2 = str2.length;
            const matrix = Array(len1 + 1).fill(null).map(() => Array(len2 + 1).fill(0));
            
            for (let i = 0; i <= len1; i++) matrix[i][0] = i;
            for (let j = 0; j <= len2; j++) matrix[0][j] = j;
            
            for (let i = 1; i <= len1; i++) {
                for (let j = 1; j <= len2; j++) {
                    const cost = str1[i-1] === str2[j-1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i-1][j] + 1,
                        matrix[i][j-1] + 1,
                        matrix[i-1][j-1] + cost
                    );
                }
            }
            
            const distance = matrix[len1][len2];
            const maxLen = Math.max(len1, len2);
            return maxLen > 0 ? ((maxLen - distance) / maxLen) * 100 : 0;
        }

        // Run OCR on canvas
        async function runOCR(canvas, label) {
            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    try {
                        const result = await Tesseract.recognize(blob, 'chi_sim+eng', {
                            logger: () => {}
                        });
                        resolve(result.data.text.trim());
                    } catch (err) {
                        console.error('OCR error:', err);
                        resolve('(OCR 识别失败)');
                    }
                }, 'image/png');
            });
        }

        // Run OCR comparison
        async function runOCRComparison() {
            if (!state.image) return;
            
            // 检查是否是第一次运行
            const isFirstRun = !localStorage.getItem('jjp-ocr-loaded');
            
            try {
                if (isFirstRun) {
                    showLoading('正在识别原图...\n\n⚠️ 第一次运行加载会很慢，请耐心等待\n（需要下载 OCR 语言包）');
                } else {
                    showLoading('正在识别原图...');
                }
                
                const origCanvas = document.createElement('canvas');
                origCanvas.width = mainCanvas.width;
                origCanvas.height = mainCanvas.height;
                const origCtx = origCanvas.getContext('2d');
                origCtx.drawImage(state.image, 0, 0);
                
                state.originalOCR = await runOCR(origCanvas, 'original');
                $('originalText').textContent = state.originalOCR || '(无文字)';
                
                // 标记为已加载
                localStorage.setItem('jjp-ocr-loaded', 'true');
                
                hideLoading();
                showLoading('正在识别处理后图片...');
                
                state.protectedOCR = await runOCR(mainCanvas, 'protected');
                $('protectedText').textContent = state.protectedOCR || '(无文字)';
                
                const similarity = calculateSimilarity(state.originalOCR, state.protectedOCR);
                const fill = $('similarityFill');
                fill.style.width = similarity + '%';
                fill.textContent = similarity.toFixed(1) + '%';
                
                if (similarity > 80) {
                    fill.style.backgroundColor = '#f87171';
                    showStatus('danger', '⚠️ 防护不足！建议提高强度或切换模式。');
                } else if (similarity > 30) {
                    fill.style.backgroundColor = '#fbbf24';
                    showStatus('warning', '⚡ 部分防护，AI 仍能识别部分内容。');
                } else {
                    fill.style.backgroundColor = '#4ade80';
                    showStatus('success', '✅ 完美致盲！AI 已失去视力。');
                }
                
                ocrPanel.classList.remove('hidden');
            } catch (err) {
                console.error('OCR comparison error:', err);
                $('originalText').textContent = '(识别失败)';
                $('protectedText').textContent = '(识别失败)';
                showStatus('warning', '⚠️ OCR 识别出错，请重试。');
                ocrPanel.classList.remove('hidden');
            } finally {
                hideLoading();
            }
        }

        function showStatus(type, message) {
            const status = $('statusMessage');
            status.className = 'status-message ' + type;
            status.textContent = message;
            status.classList.remove('hidden');
        }

        function getDisplayDims() {
            if (!state.image) return { w:0, h:0 };
            const cw = window.innerWidth - 32;
            const maxW = Math.min(896, cw);
            const maxH = Math.min(window.innerHeight * 0.5, 500);
            const scale = Math.min(1, maxW/state.image.width, maxH/state.image.height);
            return { w: state.image.width*scale, h: state.image.height*scale };
        }

        function showCanvas() {
            const dims = getDisplayDims();
            if (state.compareMode) {
                canvasArea.innerHTML = `
                    <div class="compare-container" id="compareContainer" style="width:${dims.w}px;height:${dims.h}px;max-width:100%">
                        <canvas id="compareCanvas" style="width:100%;height:100%"></canvas>
                        <div class="split-line" id="splitLine" style="left:${state.splitPosition}%">
                            <div class="split-handle">⇔</div>
                        </div>
                        <div class="compare-label original">原始</div>
                        <div class="compare-label processed">迷彩</div>
                    </div>`;
                compareCanvas = $('compareCanvas');
                compareContainer = $('compareContainer');
                renderComparison();
                $('splitLine').addEventListener('mousedown', () => state.isDraggingSplit=true);
                $('splitLine').addEventListener('touchstart', () => state.isDraggingSplit=true);
            } else {
                canvasArea.innerHTML = `
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="visibleCanvas" class="canvas-display"></canvas>
                        <div class="magnifier" id="magnifier"><canvas id="magnifierCanvas"></canvas></div>
                        <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:3px 10px;background:rgba(0,0,0,0.7);border-radius:4px;font-size:11px;color:#67e8f9;pointer-events:none">悬停查看像素级干扰</div>
                    </div>`;
                updateVisibleCanvas();
                setupMagnifier();
            }
        }

        function updateVisibleCanvas() {
            const vc = $('visibleCanvas');
            if (!vc || !mainCanvas) return;
            vc.width = mainCanvas.width; 
            vc.height = mainCanvas.height;
            const ctx = vc.getContext('2d');
            // Bug Fix: 明确指定目标尺寸，避免图片放大到左上角
            if (ctx) ctx.drawImage(mainCanvas, 0, 0, vc.width, vc.height);
        }

        function renderComparison() {
            if (!state.compareMode || !compareCanvas || !state.image || !mainCanvas) return;
            const ctx = compareCanvas.getContext('2d');
            if (!ctx) return;
            // 使用 mainCanvas 的尺寸
            compareCanvas.width = mainCanvas.width;
            compareCanvas.height = mainCanvas.height;
            const cw = compareCanvas.width;
            const ch = compareCanvas.height;
            const splitX = Math.floor((state.splitPosition/100)*cw);
            
            // Bug Fix: 左边原图 - 按比例从原图裁剪对应区域
            // 计算原图中对应的裁剪区域
            const srcSplitX = Math.floor((state.splitPosition/100)*state.image.width);
            ctx.drawImage(
                state.image,
                0, 0, srcSplitX, state.image.height,   // 源图裁剪区域
                0, 0, splitX, ch                         // 目标绘制区域
            );
            
            // 右边：处理后的图（已经是 mainCanvas 尺寸）
            ctx.drawImage(
                mainCanvas,
                splitX, 0, cw-splitX, ch,
                splitX, 0, cw-splitX, ch
            );
        }

        function setupMagnifier() {
            const container = $('canvasContainer'), canvas = $('visibleCanvas');
            const magnifier = $('magnifier'), magCanvas = $('magnifierCanvas');
            if (!container||!canvas||!magnifier||!magCanvas) return;
            const magCtx = magCanvas.getContext('2d');
            magCanvas.width = 150; magCanvas.height = 150;
            canvas.addEventListener('mouseenter', () => magnifier.classList.add('active'));
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX-rect.left, y = e.clientY-rect.top;
                magnifier.style.display = 'block';
                magnifier.style.left = (e.clientX-rect.left+20)+'px';
                magnifier.style.top = (e.clientY-rect.top-75)+'px';
                const zoomSize = 15;
                const sourceX = (x/rect.width)*canvas.width - zoomSize/2;
                const sourceY = (y/rect.height)*canvas.height - zoomSize/2;
                magCtx.clearRect(0,0,150,150);
                magCtx.imageSmoothingEnabled = false;
                magCtx.drawImage(canvas, sourceX, sourceY, zoomSize, zoomSize, 0, 0, 150, 150);
            });
            canvas.addEventListener('mouseleave', () => {
                magnifier.style.display = 'none';
                magnifier.classList.remove('active');
            });
        }

        // File handling
        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;
            showLoading('加载图片...');
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    state.image = img;
                    state.compareMode = false;
                    const maxDim = 1200;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        const scale = maxDim / Math.max(w, h);
                        w = Math.round(w * scale);
                        h = Math.round(h * scale);
                    }
                    mainCanvas.width = w; mainCanvas.height = h;
                    const ctx = mainCanvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    state.originalData = new Uint8ClampedArray(ctx.getImageData(0,0,w,h).data);

                    uploadZone.classList.add('hidden');
                    canvasArea.classList.remove('hidden');
                    controlsArea.classList.remove('hidden');
                    ocrPanel.classList.add('hidden');

                    applyCamouflage();
                    showCanvas();
                    hideLoading(); // 图片加载完成，立即隐藏加载弹窗
                };
                img.onerror = () => {
                    hideLoading();
                    alert('图片加载失败，请重试');
                };
                img.src = e.target.result;
            };
            reader.onerror = () => {
                hideLoading();
                alert('文件读取失败，请重试');
            };
            reader.readAsDataURL(file);
        }

        // Events
        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault(); uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
        const debouncedRender = debounce(() => {
            if (state.image) {
                applyCamouflage();
                if (state.compareMode) renderComparison(); else updateVisibleCanvas();
                // 不自动运行 OCR，让用户手动点击
            }
        }, 150);

        intensitySlider.addEventListener('input', (e) => {
            state.intensity = Number(e.target.value);
            intensityValue.textContent = (state.intensity / 10).toFixed(1) + '%';
            debouncedRender();
        });

        document.querySelectorAll('[data-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const preset = btn.dataset.preset;
                state.mode = preset;
                state.intensity = PRESETS[preset].intensity;
                intensitySlider.value = state.intensity;
                intensityValue.textContent = (state.intensity / 10).toFixed(1) + '%';
                modeDesc.textContent = PRESETS[preset].desc;
                debouncedRender();
            });
        });

        compareBtn.addEventListener('click', () => {
            state.compareMode = !state.compareMode;
            compareBtn.classList.toggle('active');
            showCanvas();
        });

        ocrBtn.addEventListener('click', () => {
            if (!state.image) return;
            runOCRComparison();
        });

        exportBtn.addEventListener('click', () => {
            if (!mainCanvas || !state.image) return;
            showLoading('导出中...');
            const link = document.createElement('a');
            link.download = `jjp-camouflage-${Date.now()}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
            setTimeout(hideLoading, 500);
        });

        resetBtn.addEventListener('click', () => {
            showLoading();
            state.image = null; state.originalData = null;
            state.compareMode = false; state.intensity = 500;
            state.originalOCR = ''; state.protectedOCR = '';
            intensitySlider.value = 500; intensityValue.textContent = '50%';
            uploadZone.classList.remove('hidden');
            canvasArea.classList.add('hidden');
            controlsArea.classList.add('hidden');
            ocrPanel.classList.add('hidden');
            setTimeout(hideLoading, 500);
        });

        // Split drag
        function handleSplitMove(clientX) {
            if (!state.isDraggingSplit || !compareContainer) return;
            const rect = compareContainer.getBoundingClientRect();
            state.splitPosition = Math.max(5, Math.min(95, ((clientX-rect.left)/rect.width)*100));
            const sl = $('splitLine');
            if (sl) sl.style.left = state.splitPosition + '%';
            renderComparison();
        }
        window.addEventListener('mousemove', (e) => handleSplitMove(e.clientX));
        window.addEventListener('touchmove', (e) => { if (state.isDraggingSplit && e.touches.length) handleSplitMove(e.touches[0].clientX); });
        window.addEventListener('mouseup', () => state.isDraggingSplit = false);
        window.addEventListener('touchend', () => state.isDraggingSplit = false);

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => { if (state.image) showCanvas(); }, 200);
        });
    </script>
</body>
</html>
